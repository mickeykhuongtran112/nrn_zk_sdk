name: SDK software checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests tools examples web mapping
      - run: python -m ruff format --check src tests tools examples web mapping
      - run: python -m pytest
      - run: python tools/export_symbols.py --check
      - run: python tools/compare_results.py
      - run: python tools/check_nation_mapping.py
      - run: python tools/check_repository.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/check_repository.py --dist dist
  pyodide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/browser/demo_client.test.cjs tests/browser/nation_service.test.mjs
      - run: npm install --prefix local_data/pyodide pyodide@314.0.7 typescript@5.9.3
      - run: node local_data/pyodide/node_modules/typescript/bin/tsc --noEmit --strict --lib es2022,dom web/zk-rfid-webserial.d.ts
      - run: node --test tests/browser/webserial.test.mjs
      - run: node tests/runtime/run_pyodide.mjs local_data/pyodide/node_modules/pyodide/pyodide.mjs
