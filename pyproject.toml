[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zk-rfid-sdk"
version = "0.2.0.dev1"
description = "Native async Python SDK for ZK Gen2 UHF RFID readers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
dev = ["build>=1", "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["zk_rfid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra -m 'not hardware'"
markers = [
  "hardware: explicit tests requiring a connected reader and suitable test tags",
  "runtime: CPython or Pyodide runtime verification",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
