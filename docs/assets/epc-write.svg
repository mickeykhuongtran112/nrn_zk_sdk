<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Targeted EPC write</title><desc id="desc">Read PC, preserve lower 11 bits and update length, write PC plus EPC from word 1, read back with a valid target and compare.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a} .title{font-size:28px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#465969}.mono{font-family:Consolas,monospace;font-size:18px}</style>
<rect width="960" height="400" rx="12" fill="#ffffff"/>
<text x="32" y="44" class="title">Targeted EPC write</text><text x="32" y="76" class="body">One operation deadline covers all three device exchanges.</text><rect x="32" y="110" width="204" height="176" rx="8" fill="#e6f3ee" stroke="#c2d4cf"/><circle cx="60" cy="141" r="15" fill="#1d6356"/><text x="60" y="147" text-anchor="middle" style="fill:white;font-size:18px;font-weight:700">1</text><text x="47" y="181" class="label">Read PC</text><text x="47" y="216" class="small">EPC bank · word 1</text><text x="47" y="250" class="small">Use the current target</text><path d="M 242 197 h 14 m -5 -5 l 5 5 -5 5" fill="none" stroke="#506675" stroke-width="2"/><rect x="264" y="110" width="204" height="176" rx="8" fill="#f5f7fa" stroke="#c2d4cf"/><circle cx="292" cy="141" r="15" fill="#1d6356"/><text x="292" y="147" text-anchor="middle" style="fill:white;font-size:18px;font-weight:700">2</text><text x="279" y="181" class="label">Update length</text><text x="279" y="216" class="small">Length = EPC words</text><text x="279" y="250" class="small">Preserve PC bits 10:0</text><path d="M 474 197 h 14 m -5 -5 l 5 5 -5 5" fill="none" stroke="#506675" stroke-width="2"/><rect x="496" y="110" width="204" height="176" rx="8" fill="#e6f3ee" stroke="#c2d4cf"/><circle cx="524" cy="141" r="15" fill="#1d6356"/><text x="524" y="147" text-anchor="middle" style="fill:white;font-size:18px;font-weight:700">3</text><text x="511" y="181" class="label">Write PC + EPC</text><text x="511" y="216" class="small">Start at word 1</text><text x="511" y="250" class="small">Leave CRC word 0 intact</text><path d="M 706 197 h 14 m -5 -5 l 5 5 -5 5" fill="none" stroke="#506675" stroke-width="2"/><rect x="728" y="110" width="204" height="176" rx="8" fill="#e6f3ee" stroke="#c2d4cf"/><circle cx="756" cy="141" r="15" fill="#1d6356"/><text x="756" y="147" text-anchor="middle" style="fill:white;font-size:18px;font-weight:700">4</text><text x="743" y="181" class="label">Read and compare</text><text x="743" y="216" class="small">Use the post-write target</text><text x="743" y="250" class="small">Keep each step result</text><text x="32" y="328" class="body">A stable, unique TID mask can select the same tag before and after its EPC changes.</text><text x="32" y="362" class="body">Write ACK + matching read-back = read_back_verified. A multiword write is not atomic.</text></svg>
