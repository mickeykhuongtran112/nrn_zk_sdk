<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">ZK command and response frames</title><desc id="desc">Commands contain Len, address, command, data and CRC. Responses add status. Len excludes itself. CRC low byte precedes high byte.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a} .title{font-size:28px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#465969}.mono{font-family:Consolas,monospace;font-size:18px}</style>
<rect width="960" height="360" rx="12" fill="#ffffff"/>
<text x="32" y="44" class="title">ZK wire frame</text><text x="32" y="76" class="body">Maximum 256 bytes including Len. No synchronization header.</text><text x="32" y="142" class="label">TX</text><rect x="94" y="110" width="76" height="52" fill="#e4f2fb" stroke="#96abbc"/><text x="132" y="142" text-anchor="middle" class="mono">Len</text><rect x="170" y="110" width="76" height="52" fill="#e4f2fb" stroke="#96abbc"/><text x="208" y="142" text-anchor="middle" class="mono">Adr</text><rect x="246" y="110" width="76" height="52" fill="#e4f2fb" stroke="#96abbc"/><text x="284" y="142" text-anchor="middle" class="mono">Cmd</text><rect x="322" y="110" width="350" height="52" fill="#e4f2fb" stroke="#96abbc"/><text x="497" y="142" text-anchor="middle" class="mono">Data · 0–251 bytes</text><rect x="672" y="110" width="107" height="52" fill="#fff1dd" stroke="#96abbc"/><text x="725.5" y="142" text-anchor="middle" class="mono">CRC_L</text><rect x="779" y="110" width="107" height="52" fill="#fff1dd" stroke="#96abbc"/><text x="832.5" y="142" text-anchor="middle" class="mono">CRC_H</text><path d="M 170 172 v 8 h 716 v -8" fill="none" stroke="#617587"/><text x="528" y="200" text-anchor="middle" class="small">Len counts these bytes</text><text x="32" y="242" class="label">RX</text><rect x="94" y="210" width="76" height="52" fill="#e4f2fb" stroke="#96abbc"/><text x="132" y="242" text-anchor="middle" class="mono">Len</text><rect x="170" y="210" width="76" height="52" fill="#e4f2fb" stroke="#96abbc"/><text x="208" y="242" text-anchor="middle" class="mono">Adr</text><rect x="246" y="210" width="76" height="52" fill="#e4f2fb" stroke="#96abbc"/><text x="284" y="242" text-anchor="middle" class="mono">Cmd</text><rect x="322" y="210" width="96" height="52" fill="#e6f3ee" stroke="#96abbc"/><text x="370" y="242" text-anchor="middle" class="mono">Status</text><rect x="418" y="210" width="254" height="52" fill="#e4f2fb" stroke="#96abbc"/><text x="545" y="242" text-anchor="middle" class="mono">Data · 0–250 bytes</text><rect x="672" y="210" width="107" height="52" fill="#fff1dd" stroke="#96abbc"/><text x="725.5" y="242" text-anchor="middle" class="mono">CRC_L</text><rect x="779" y="210" width="107" height="52" fill="#fff1dd" stroke="#96abbc"/><text x="832.5" y="242" text-anchor="middle" class="mono">CRC_H</text><path d="M 170 272 v 8 h 716 v -8" fill="none" stroke="#617587"/><text x="528" y="300" text-anchor="middle" class="small">Len counts these bytes</text><text x="32" y="338" class="body">CRC covers Len through Data. Append low byte first, then high byte.</text></svg>
