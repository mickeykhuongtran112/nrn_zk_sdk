<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc">
<title id="title">Gen2 tag memory</title><desc id="desc">Four independent banks. Reserved has Kill and Access passwords. EPC has CRC at word 0, PC at word 1 and EPC from word 2. TID and User capacities depend on the chip.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a} .title{font-size:28px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#465969}.mono{font-family:Consolas,monospace;font-size:18px}</style>
<rect width="960" height="630" rx="12" fill="#ffffff"/>
<text x="32" y="44" class="title">Gen2 tag memory</text><text x="32" y="76" class="body">Each bank has its own address space. One word = 16 bits = 2 bytes.</text><rect x="32" y="105" width="896" height="98" rx="8" fill="#e4f2fb" stroke="#cad4de"/>
<text x="52" y="134" class="small">BANK 00 (binary)</text><text x="52" y="162" class="label">Reserved</text><rect x="252" y="119" width="320" height="70" rx="5" fill="#ffffff" stroke="#bfd3df"/><text x="267" y="147" class="label">Kill password</text><text x="267" y="173" class="small">Words 0–1 · 32 bits</text><rect x="585" y="119" width="320" height="70" rx="5" fill="#ffffff" stroke="#bfd3df"/><text x="600" y="147" class="label">Access password</text><text x="600" y="173" class="small">Words 2–3 · 32 bits</text><rect x="32" y="221" width="896" height="134" rx="8" fill="#f0eafb" stroke="#cad4de"/>
<text x="52" y="250" class="small">BANK 01 (binary)</text><text x="52" y="278" class="label">EPC</text><rect x="252" y="238" width="210" height="98" rx="5" fill="#ffffff" stroke="#c5bdd4"/><text x="264" y="270" class="label">CRC-16</text><text x="264" y="303" class="small">Word 0</text><rect x="474" y="238" width="210" height="98" rx="5" fill="#ffffff" stroke="#c5bdd4"/><text x="486" y="270" class="body">Protocol control (PC)</text><text x="486" y="303" class="small">Word 1</text><rect x="696" y="238" width="210" height="98" rx="5" fill="#ffffff" stroke="#c5bdd4"/><text x="708" y="270" class="label">EPC</text><text x="708" y="303" class="small">Word 2 onward</text><rect x="32" y="373" width="896" height="84" rx="8" fill="#e6f3ee" stroke="#cad4de"/>
<text x="52" y="402" class="small">BANK 10 (binary)</text><text x="52" y="430" class="label">TID</text><text x="267" y="407" class="label">Chip identification / optional serial</text><text x="267" y="434" class="body">From word 0 · chip-dependent length</text><rect x="32" y="475" width="896" height="84" rx="8" fill="#fff1dd" stroke="#cad4de"/>
<text x="52" y="504" class="small">BANK 11 (binary)</text><text x="52" y="532" class="label">User</text><text x="267" y="509" class="label">Application data</text><text x="267" y="536" class="body">From word 0 · may be absent</text><text x="32" y="597" class="body">Address conversion: EPC word 2 = bit 32 (0x20). Masks use bits; reads/writes use words.</text></svg>
